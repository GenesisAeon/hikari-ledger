[project]
name = "hikari-ledger"
version = "1.0.1"
description = "Proof-of-Resonance distributed consensus — CREP-weighted validation for genesis-os node networks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer" }]
requires-python = ">=3.11"
keywords = ["genesisaeon", "consensus", "blockchain", "crep", "utac", "distributed-systems"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
hikari-ledger = "hikari_ledger.cli:app"

[project.urls]
Homepage = "https://github.com/GenesisAeon/hikari-ledger"
Repository = "https://github.com/GenesisAeon/hikari-ledger"
Documentation = "https://genesisaeon.github.io/hikari-ledger"
Issues = "https://github.com/GenesisAeon/hikari-ledger/issues"
Zenodo = "https://doi.org/10.5281/zenodo.20788575"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hikari_ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hikari_ledger --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
